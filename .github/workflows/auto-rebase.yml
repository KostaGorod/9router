name: Daily upstream merge and Kosta release
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kosta-release
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  validate:
    if: github.repository == 'KostaGorod/9router' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      fork: ${{ steps.merge.outputs.fork }}
      upstream: ${{ steps.merge.outputs.upstream }}
      commit: ${{ steps.merge.outputs.commit }}
      tree: ${{ steps.merge.outputs.tree }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: master
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Merge exact source heads without rewriting history
        id: merge
        working-directory: source
        run: |
          git remote add upstream https://github.com/decolua/9router.git
          git fetch --no-tags upstream master '+refs/tags/*:refs/upstream-tags/*'
          FORK_SHA="$(git rev-parse HEAD)"
          UPSTREAM_SHA="$(git rev-parse upstream/master)"
          export FORK_SHA UPSTREAM_SHA
          node ../workflow/scripts/kosta-release.mjs merge
      - name: Install and verify integrated source (including no-change retries)
        working-directory: source
        run: |
          if [ -f package-lock.json ]; then npm ci --ignore-scripts; else npm install --ignore-scripts --no-package-lock; fi
          npm --prefix tests install --ignore-scripts --no-package-lock
          node --test tests/release/kosta-release.test.mjs
          (cd tests && npx vitest run unit/custom-model-v1-list.test.js unit/model-token-limits.test.js unit/custom-model-limits-route.test.js unit/combo-context-marker.test.js unit/combo-capabilities.test.js)
          npm run build

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
      commit: ${{ steps.publish.outputs.commit }}
      upstream: ${{ steps.publish.outputs.upstream }}
      upstream_tag: ${{ steps.publish.outputs.upstream_tag }}
    steps:
      # Only workflow-pinned helper code executes with the write token.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.fork }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Reproduce exact validated commit and allocate immutable tag
        id: publish
        working-directory: source
        env:
          FORK_SHA: ${{ needs.validate.outputs.fork }}
          UPSTREAM_SHA: ${{ needs.validate.outputs.upstream }}
          VALIDATED_COMMIT: ${{ needs.validate.outputs.commit }}
          VALIDATED_TREE: ${{ needs.validate.outputs.tree }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote add upstream https://github.com/decolua/9router.git
          git fetch --no-tags upstream master '+refs/tags/*:refs/upstream-tags/*'
          git fetch origin --tags
          node ../workflow/scripts/kosta-release.mjs publish

  image:
    needs: publish
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      release_tag: ${{ needs.publish.outputs.tag }}
      commit: ${{ needs.publish.outputs.commit }}
      upstream: ${{ needs.publish.outputs.upstream }}
      upstream_tag: ${{ needs.publish.outputs.upstream_tag }}
    secrets: inherit
